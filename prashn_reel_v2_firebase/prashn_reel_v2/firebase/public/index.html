<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ब्रह्मास्त्र</title>
<style>
  :root{
    --bg:#F7F3EC; --card:#FFFCF6; --ink:#231B14; --muted:#7A6A58;
    --line:#E3D9C8; --brand:#8C3A1E;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.75; font-size:16px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:48px 20px 64px}
  h1{font-size:28px; margin:0 0 6px; font-weight:800; color:var(--brand)}
  .sub{color:var(--muted); font-size:14px; margin:0 0 32px}
  a.row{
    display:block; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; margin:12px 0;
    text-decoration:none; color:var(--ink); font-weight:700;
  }
  a.row span{display:block; font-weight:400; font-size:14px; color:var(--muted); margin-top:2px}
  footer{margin-top:44px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px}
  code{background:var(--card); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:14px}
  @media (prefers-color-scheme: dark){
    :root{--bg:#17120E; --card:#201913; --ink:#F0E7DB; --muted:#A6947E; --line:#3A2E24; --brand:#E08A64}
  }
</style>
</head>
<body>

</footer>

</div>
</body>
</html>
