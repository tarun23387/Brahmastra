<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:18px;background:#fff;font:600 16px sans-serif;color:#231B14}
.row{display:flex;gap:22px;align-items:center;margin-bottom:18px}
.circ{width:144px;height:144px;border-radius:50%;overflow:hidden;position:relative}
.circ img{position:absolute;width:216px;height:216px;left:-36px;top:-36px}
.sq{width:144px;height:144px;border-radius:30%;overflow:hidden;position:relative}
.sq img{position:absolute;width:216px;height:216px;left:-36px;top:-36px}
.home{background:#2b4c6f;padding:14px;border-radius:14px;display:flex;gap:14px;align-items:center}
.s{width:52px;height:52px}.s img{width:78px;height:78px;left:-13px;top:-13px}
.play{width:144px;height:144px;border-radius:20%;overflow:hidden}.play img{width:100%}
.n{background:#333;padding:10px;display:flex;gap:12px;align-items:center;border-radius:8px}
</style></head><body>
<div class="row">launcher: गोल / squircle / home screen</div>
<div class="row"><div class="circ"><img src="../../android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png"></div>
<div class="sq"><img src="../../android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png"></div>
<div class="home"><div class="circ s"><img src="../../android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png"></div><div class="sq s"><img src="../../android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png"></div></div></div>
<div class="row">Play Store / splash / notification</div>
<div class="row"><div class="play"><img src="../../play-listing/store-icon-512.png"></div>
<div style="background:#F7F3EC;padding:20px"><img src="../../assets/images/logo.png" width="120"></div>
<div class="n"><img src="notif.svg" width="72"><img src="notif.svg" width="24"></div></div>
</body></html>
