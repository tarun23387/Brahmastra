<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:#e9e4da;font:600 22px sans-serif;color:#231B14;width:1500px}
.row{display:flex;align-items:center;gap:36px;margin-bottom:30px;background:#fff;border-radius:18px;padding:20px}
.lab{width:150px}
.big{width:300px;height:300px;border-radius:66px;overflow:hidden;box-shadow:0 6px 18px #0002}
.circ{width:200px;height:200px;border-radius:50%;overflow:hidden;box-shadow:0 6px 18px #0002}
.circ img{width:300px;height:300px;margin:-50px}
.small{width:48px;height:48px;border-radius:12px;overflow:hidden}
.dark{background:#1b1b1b;padding:18px;border-radius:14px;display:flex;gap:18px}
img{display:block;width:100%;height:100%}
</style></head><body>
<div class="row"><div class="lab">A<br>किताब + बाण</div><div class="big"><img src="a-book-arrow.svg"></div><div class="circ"><img src="a-book-arrow.svg"></div><div class="small"><img src="a-book-arrow.svg"></div><div class="dark"><div class="small"><img src="a-book-arrow.svg"></div></div></div>
<div class="row"><div class="lab">C<br>सूर्य-बाण</div><div class="big"><img src="c-sun-arrow.svg"></div><div class="circ"><img src="c-sun-arrow.svg"></div><div class="small"><img src="c-sun-arrow.svg"></div><div class="dark"><div class="small"><img src="c-sun-arrow.svg"></div></div></div>
</body></html>
